<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#26384b">
<title>iPhone</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#151923;color:white}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#phone{position:relative;width:100%;max-width:430px;height:100dvh;min-height:560px;margin:auto;overflow:hidden;background:#273b50}
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.active{display:block}
.wallpaper{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 75% 23%,#b3c2ce 0%,transparent 34%),radial-gradient(ellipse at 20% 60%,#647e96 0%,transparent 42%),linear-gradient(155deg,#526a80,#293d54 65%,#141e2b)}
.status{position:absolute;z-index:5;top:0;left:0;right:0;height:46px;padding:13px 26px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.status-right{display:flex;align-items:center;gap:6px;font-size:12px}
.battery{position:relative;width:22px;height:11px;border:1.5px solid white;border-radius:3px}
.battery:before{content:"";position:absolute;inset:2px;background:white;border-radius:1px}
.battery:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:white}
#lock{text-align:center;touch-action:pan-y}
.lock-time{position:absolute;top:14%;left:0;right:0;font-size:clamp(76px,21vw,96px);line-height:1.1;font-weight:300;letter-spacing:-4px;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px #0002}
.lock-date{position:absolute;top:calc(14% + 101px);left:0;right:0;font-size:19px;font-weight:500}
.lock-bottom{position:absolute;bottom:0;left:0;right:0;height:180px}
.lock-hint{position:absolute;bottom:103px;left:0;right:0;font-size:12px;color:#ffffffdd}
.quick-actions{position:absolute;bottom:43px;left:32px;right:32px;display:flex;justify-content:space-between}
.quick{width:48px;height:48px;border-radius:50%;background:#252b35aa;border:1px solid #ffffff25;color:white;font-size:22px}
.home-bar{position:absolute;z-index:15;bottom:8px;left:calc(50% - 67px);width:134px;height:5px;border-radius:8px;background:white}
.home-bar.dark{background:#222}
#passcode{background:#f5f5f7;color:#202024;text-align:center}
.pass-title{position:absolute;top:11%;left:0;right:0;font-size:21px;font-weight:600}
.pass-subtitle{position:absolute;top:16%;left:0;right:0;font-size:14px;color:#777}
.pass-dots{position:absolute;top:24%;left:0;right:0;display:flex;justify-content:center;gap:17px}
.pass-dot{width:12px;height:12px;border-radius:50%;border:1px solid #85858a}
.pass-dot.filled{background:#242428;border-color:#242428}
.pass-error{position:absolute;top:29%;left:10px;right:10px;min-height:18px;color:#d22;font-size:13px}
.keypad{position:absolute;top:35%;left:0;right:0;padding:0 32px;display:grid;grid-template-columns:repeat(3,1fr);row-gap:13px}
.key{justify-self:center;width:min(21vw,72px);height:min(21vw,72px);max-width:72px;max-height:72px;border-radius:50%;background:#d9d9de;color:#242428;font-size:29px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.key:active{background:#b8b8c0}
.key small{font-size:9px;letter-spacing:2px;margin-top:1px}
.key.blank{visibility:hidden}
.pass-bottom{position:absolute;bottom:48px;left:25px;right:25px;display:flex;justify-content:space-between}
.text-btn{background:none;color:#087aff;padding:10px;font-size:14px}
#home{padding:58px 19px 132px}
.home-wall{background:linear-gradient(155deg,#8199aa,#41586b 50%,#263849)}
#appGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:10px;row-gap:22px}
.app{min-width:0;background:none;border:0;padding:0;color:white;text-align:center}
.app-icon{width:min(16vw,60px);height:min(16vw,60px);max-width:60px;max-height:60px;margin:0 auto 6px;border-radius:14px;overflow:hidden;background:#ffffff18;display:flex;align-items:center;justify-content:center}
.app-icon img{width:100%;height:100%;object-fit:cover}
.app-label{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #0008}
.empty-app .app-icon{background:transparent;border:1px solid #ffffff0c}
.empty-app .app-label{visibility:hidden}
.dock{position:absolute;left:15px;right:15px;bottom:26px;height:90px;border-radius:26px;background:#ffffff35;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-evenly}
.dock .app{width:25%}
.dock .app-label{display:none}
.dock .app-icon{width:min(13.5vw,55px);height:min(13.5vw,55px)}
#appPage{background:#f5f5f7;color:#222}
.app-nav{position:absolute;top:0;left:0;right:0;height:calc(55px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;background:#f5f5f7ee;border-bottom:1px solid #ddd;padding-left:12px}
.app-back{background:none;color:#087aff;padding:10px;font-size:16px}
#appTitle{position:absolute;left:85px;right:85px;text-align:center;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#appContent{position:absolute;top:calc(55px + env(safe-area-inset-top));bottom:20px;left:0;right:0;padding:20px;overflow:auto;white-space:pre-wrap;line-height:1.6}
#appPage .home-bar,#editor .home-bar{background:#222}
#editor{background:#f5f5f7;color:#222;overflow-y:auto;padding:calc(25px + env(safe-area-inset-top)) 20px 45px}
#editor h2{font-size:24px}
#editor label{display:block;margin:15px 0 6px;font-size:14px}
#editor select,#editor textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;background:white;color:#222;font-size:16px}
#editor textarea{resize:vertical}
.editor-btn{background:#087aff;color:white;border-radius:10px;padding:12px 16px;margin-top:12px}
.editor-btn.secondary{background:#777}
#firebaseStatus{font-size:12px;color:#555;overflow-wrap:anywhere}
#toast{position:absolute;z-index:30;bottom:70px;left:20px;right:20px;padding:12px;background:#242424eF;color:white;border-radius:12px;text-align:center;display:none;font-size:14px}
@media(min-width:500px){#phone{height:min(900px,100dvh)}}
</style>
</head>
<body>
<div id="phone">

<section id="lock" class="screen active">
  <div class="wallpaper"></div>
  <div class="status"><span id="lockStatusTime">9:41</span><span class="status-right">●●●　Wi-Fi <span class="battery"></span></span></div>
  <div class="lock-time" id="lockTime">9:41</div>
  <div class="lock-date" id="lockDate"></div>
  <div class="lock-bottom">
    <div class="lock-hint">向上轻扫以解锁</div>
    <div class="quick-actions">
      <button class="quick" aria-label="手电筒">ϟ</button>
      <button class="quick" id="cameraShortcut" aria-label="相机">◎</button>
    </div>
  </div>
  <div class="home-bar" id="lockBar"></div>
</section>

<section id="passcode" class="screen">
  <div class="pass-title">输入密码</div>
  <div class="pass-subtitle">请输入密码以解锁 iPhone</div>
  <div class="pass-dots" id="passDots">
    <span class="pass-dot"></span><span class="pass-dot"></span>
    <span class="pass-dot"></span><span class="pass-dot"></span>
  </div>
  <div class="pass-error" id="passError"></div>
  <div class="keypad" id="keypad">
    <button class="key" data-num="1">1</button>
    <button class="key" data-num="2">2<small>ABC</small></button>
    <button class="key" data-num="3">3<small>DEF</small></button>
    <button class="key" data-num="4">4<small>GHI</small></button>
    <button class="key" data-num="5">5<small>JKL</small></button>
    <button class="key" data-num="6">6<small>MNO</small></button>
    <button class="key" data-num="7">7<small>PQRS</small></button>
    <button class="key" data-num="8">8<small>TUV</small></button>
    <button class="key" data-num="9">9<small>WXYZ</small></button>
    <button class="key blank" aria-hidden="true"></button>
    <button class="key" data-num="0">0</button>
    <button class="key" id="deleteKey" style="background:transparent;font-size:14px">删除</button>
  </div>
  <div class="pass-bottom"><button class="text-btn" id="emergencyBtn">紧急情况</button><button class="text-btn" id="cancelPass">取消</button></div>
</section>

<section id="home" class="screen">
  <div class="wallpaper home-wall"></div>
  <div class="status"><span id="homeTime">9:41</span><span class="status-right">●●●　Wi-Fi <span class="battery"></span></span></div>
  <div id="appGrid"></div>
  <div class="dock" id="dock"></div>
</section>

<section id="appPage" class="screen">
  <div class="app-nav"><button class="app-back" id="backHome">‹ 返回</button><div id="appTitle"></div></div>
  <div id="appContent">此页面暂时为空。</div>
  <div class="home-bar dark" id="appHomeBar"></div>
</section>

<section id="editor" class="screen">
  <h2>编辑系统</h2>
  <p>在这里填写你自己的 App 页面内容。</p>
  <label for="editApp">选择软件</label>
  <select id="editApp"></select>
  <label for="editText">页面内容</label>
  <textarea id="editText" rows="8" placeholder="自行添加内容"></textarea>
  <button class="editor-btn" id="saveContent">保存内容</button>
  <button class="editor-btn secondary" id="exitEditor">退出编辑</button>
  <p id="firebaseStatus">本机保存可用；Firebase 需单独配置。</p>
  <div class="home-bar dark"></div>
</section>

<div id="toast"></div>
</div>

<script>
/* 密码 */
const UNLOCK_PASSWORD = "0000";
const EDITOR_PASSWORD = "1225";

/* 保留已上传的 12 张原图；将文件放入仓库 icons 文件夹 */
const apps = [
 {name:"微博",image:"IMG_2091.png"},
 {name:"微信",image:"IMG_2092.png"},
 {name:"相机",image:"IMG_2093.png"},
 {name:"小红书",image:"IMG_2094.png"},
 {name:"信息",image:"IMG_2095.png"},
 {name:"时钟",image:"IMG_2096.png"},
 {name:"音乐",image:"IMG_2097.png"},
 {name:"日历",image:"IMG_2098.png"},
 {name:"Instagram",image:"IMG_2099.jpeg"},
 {name:"KakaoTalk",image:"IMG_2100.png"},
 {name:"照片",image:"IMG_2101.png"},
 {name:"QQ",image:"IMG_2102.png"},
 {name:"空白 App 13",image:""},
 {name:"空白 App 14",image:""},
 {name:"空白 App 15",image:""},
 {name:"空白 App 16",image:""},
 {name:"空白 App 17",image:""},
 {name:"空白 App 18",image:""},
 {name:"空白 App 19",image:""},
 {name:"空白 App 20",image:""},
 {name:"空白 App 21",image:""},
 {name:"空白 App 22",image:""}
];

const $ = id => document.getElementById(id);
let entered = "";
let editorUnlocked = false;
let currentApp = -1;
let touchStartY = 0;
const contentKey = "iphoneAppContent_v2";

function showScreen(id){
 document.querySelectorAll(".screen").forEach(el=>el.classList.remove("active"));
 $(id).classList.add("active");
}
function toast(message){
 $("toast").textContent=message;
 $("toast").style.display="block";
 clearTimeout(toast.timer);
 toast.timer=setTimeout(()=>$("toast").style.display="none",2000);
}
function updateClock(){
 const now=new Date();
 const time=now.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false});
 $("lockTime").textContent=time;
 $("lockStatusTime").textContent=time;
 $("homeTime").textContent=time;
 $("lockDate").textContent=now.toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"long"});
}
updateClock();
setInterval(updateClock,15000);

function showPasscode(){
 entered="";
 updateDots();
 $("passError").textContent="";
 showScreen("passcode");
}
function updateDots(){
 document.querySelectorAll(".pass-dot").forEach((dot,i)=>dot.classList.toggle("filled",i<entered.length));
}
function enterDigit(digit){
 if(entered.length>=4)return;
 entered+=digit;
 updateDots();
 if(entered.length===4){
  if(entered===UNLOCK_PASSWORD){
   entered="";
   showScreen("home");
  }else if(entered===EDITOR_PASSWORD){
   entered="";
   editorUnlocked=true;
   $("editApp").value=apps[0].name;
   loadEditorText();
   showScreen("editor");
  }else{
   $("passError").textContent="密码不正确，请重试";
   setTimeout(()=>{entered="";updateDots();$("passError").textContent="";},650);
  }
 }
}
$("keypad").addEventListener("click",e=>{
 const btn=e.target.closest("button[data-num]");
 if(btn)enterDigit(btn.dataset.num);
});
$("deleteKey").addEventListener("click",()=>{
 entered=entered.slice(0,-1);
 updateDots();
 $("passError").textContent="";
});
$("cancelPass").addEventListener("click",()=>{entered="";showScreen("lock")});
$("emergencyBtn").addEventListener("click",()=>toast("紧急功能未启用"));

/* 上滑解锁 */
$("lock").addEventListener("touchstart",e=>{touchStartY=e.touches[0].clientY},{passive:true});
$("lock").addEventListener("touchend",e=>{
 const endY=e.changedTouches[0].clientY;
 if(touchStartY-endY>35)showPasscode();
},{passive:true});
$("lock").addEventListener("click",e=>{
 if(e.target.closest(".quick"))return;
});
$("lockBar").addEventListener("click",showPasscode);
$("lock").addEventListener("dblclick",showPasscode);

/* App 图标 */
function makeApp(app,index){
 const btn=document.createElement("button");
 btn.className="app"+(!app.image?" empty-app":"");
 btn.type="button";
 const icon=document.createElement("div");
 icon.className="app-icon";
 if(app.image){
  const img=document.createElement("img");
  img.src="icons/"+app.image;
  img.alt=app.name;
  img.onerror=()=>{img.remove();icon.style.background="transparent";};
  icon.appendChild(img);
 }
 const label=document.createElement("div");
 label.className="app-label";
 label.textContent=app.image?app.name:"";
 btn.append(icon,label);
 btn.addEventListener("click",()=>{
  if(!app.image){toast("这个位置暂时留空");return;}
  openApp(index);
 });
 return btn;
}
apps.forEach((app,index)=>{
 if(index<20)$("appGrid").appendChild(makeApp(app,index));
});
[1,2,10,4].forEach(index=>$("dock").appendChild(makeApp(apps[index],index)));

function readContent(){
 try{return JSON.parse(localStorage.getItem(contentKey)||"{}")}
 catch{return {}}
}
function openApp(index){
 currentApp=index;
 $("appTitle").textContent=apps[index].name;
 $("appContent").textContent=readContent()[apps[index].name]||"此页面暂时为空。";
 showScreen("appPage");
}
$("backHome").addEventListener("click",()=>showScreen("home"));
$("appHomeBar").addEventListener("click",()=>showScreen("home"));

apps.forEach(app=>{
 const option=document.createElement("option");
 option.value=app.name;
 option.textContent=app.name;
 $("editApp").appendChild(option);
});
function loadEditorText(){
 $("editText").value=readContent()[$("editApp").value]||"";
}
$("editApp").addEventListener("change",loadEditorText);
$("saveContent").addEventListener("click",()=>{
 if(!editorUnlocked){toast("请重新输入编辑密码");showScreen("passcode");return}
 const data=readContent();
 data[$("editApp").value]=$("editText").value;
 localStorage.setItem(contentKey,JSON.stringify(data));
 $("firebaseStatus").textContent="内容已保存在当前浏览器。Firebase 尚未连接。";
 toast("保存成功");
});
$("exitEditor").addEventListener("click",()=>{
 editorUnlocked=false;
 showScreen("home");
});
</script>
</body>
</html>
