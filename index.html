
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>My iPhone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:white}
button,input,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.phone{position:relative;width:100%;max-width:430px;height:100dvh;min-height:600px;margin:auto;overflow:hidden;background:#536c88}
.wallpaper{position:absolute;inset:0;background:linear-gradient(145deg,#d8d2ed,#799ab8 50%,#26364c);background-size:cover;background-position:center}
.status{position:absolute;top:13px;left:24px;right:24px;display:flex;justify-content:space-between;font-size:13px;font-weight:600;z-index:3;pointer-events:none}
.lock{position:absolute;inset:0;text-align:center;padding-top:75px;z-index:1}
.lock-date{font-size:16px;text-shadow:0 1px 8px #333}
.lock-time{font-size:82px;font-weight:300;letter-spacing:-4px;line-height:1.2;text-shadow:0 2px 10px #333}
.lock-photo{position:absolute;top:42%;left:8%;width:84%;height:22%;border-radius:25px;background:linear-gradient(135deg,#d6d1ed,#89a6bf,#344761);background-size:cover;background-position:center}
.lock-bottom{position:absolute;bottom:35px;left:0;right:0;font-size:13px;text-shadow:0 1px 6px #333}
.passcode{display:none;position:absolute;inset:0;z-index:10;text-align:center;padding:75px 30px 25px;background:#26364cee;backdrop-filter:blur(22px)}
.passcode h2{font-size:24px;font-weight:400}
.pin-dots{font-size:24px;letter-spacing:8px;height:40px;margin:22px 0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:270px;margin:auto}
.keypad button{height:60px;border:0;border-radius:50%;background:#ffffff30;color:white;font-size:23px}
.keypad button:active{background:#ffffff70}
.home{display:none;position:absolute;inset:0;z-index:2;padding:55px 17px 110px;overflow:hidden}
.widget{height:150px;border-radius:24px;background:linear-gradient(135deg,#c9c7e5,#8baac0,#344761);background-size:cover;background-position:center;position:relative;overflow:hidden;margin-bottom:25px;border:1px solid #ffffff30}
.widget:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0005,transparent)}
.widget-text{position:absolute;z-index:1;left:17px;bottom:15px;text-shadow:0 1px 8px #222}
.widget-time{font-size:36px;font-weight:300}
.widget-date{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px}
.appicon{border:0;background:none;color:white;padding:0;text-align:center;text-shadow:0 1px 4px #333;min-width:0}
.icon{width:55px;height:55px;border-radius:14px;background:linear-gradient(145deg,#f7f7fa,#c6ced9);color:#34445a;display:grid;place-items:center;margin:0 auto 6px;font-size:23px;font-weight:600}
.appicon span{font-size:11px;white-space:nowrap}
.dock{position:absolute;bottom:20px;left:14px;right:14px;padding:12px 8px;border-radius:26px;background:#ffffff38;backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dock .icon{width:51px;height:51px}
.dots{position:absolute;bottom:101px;left:0;right:0;text-align:center;font-size:13px;letter-spacing:7px;color:#fff}
.ownerbar{display:none;position:absolute;top:43px;right:13px;z-index:4}
.ownerbar button{border:0;border-radius:20px;padding:8px 12px;background:#fff;color:#222;font-size:12px}
.appscreen,.editor{display:none;position:absolute;inset:0;z-index:6;overflow:auto;background:#f4f4f7;color:#18181b;padding:54px 17px 30px}
.apphead{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.apphead button,.secondary{border:0;border-radius:18px;padding:9px 13px;background:#e5e5eb;color:#222}
.apphead h2{font-size:22px;margin:0}
.entry{background:white;border-radius:15px;padding:14px;margin:10px 0;overflow-wrap:anywhere;white-space:pre-wrap}
textarea,.field{display:block;width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;background:white;color:#222;margin:7px 0}
textarea{min-height:80px}
.primary{border:0;border-radius:12px;padding:12px 16px;background:#1677ff;color:white;margin:5px 0}
.editor label{display:block;color:#666;font-size:13px;margin-top:13px}
.notice{color:#777;font-size:12px;line-height:1.5}
.albumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.albumgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px}
#toast{display:none;position:absolute;z-index:20;top:55px;left:20%;width:60%;padding:10px;background:#222e;color:white;border-radius:15px;text-align:center}
</style>
</head>
<body>
<div class="phone" id="phone">
<div class="wallpaper" id="wallpaper"></div>
<div class="status"><span id="statusTime">09:41</span><span>●●● ▰</span></div>

<section class="lock" id="lock" onclick="showPin()">
<div class="lock-date" id="lockDate"></div>
<div class="lock-time" id="lockTime">09:41</div>
<div class="lock-photo" id="lockPhoto"></div>
<div class="lock-bottom">轻点屏幕以解锁</div>
</section>

<section class="passcode" id="passcode">
<h2>输入密码</h2>
<div class="pin-dots" id="pinDots">○ ○ ○ ○</div>
<div class="keypad" id="keypad">
<button type="button" data-key="1">1</button>
<button type="button" data-key="2">2</button>
<button type="button" data-key="3">3</button>
<button type="button" data-key="4">4</button>
<button type="button" data-key="5">5</button>
<button type="button" data-key="6">6</button>
<button type="button" data-key="7">7</button>
<button type="button" data-key="8">8</button>
<button type="button" data-key="9">9</button>
<button type="button" data-key="clear">⌫</button>
<button type="button" data-key="0">0</button>
<button type="button" data-key="cancel">取消</button>
</div>
</section>

<section class="home" id="home">
<div class="widget" id="widget">
<div class="widget-text">
<div class="widget-time" id="homeTime"></div>
<div class="widget-date" id="homeDate"></div>
</div>
</div>
<div class="grid" id="grid"></div>
<div class="dots" id="dots">● ○</div>
<div class="dock" id="dock"></div>
</section>

<div class="ownerbar" id="ownerbar">
<button onclick="openEditor()">编辑手机</button>
</div>

<section class="appscreen" id="appscreen">
<div class="apphead">
<button onclick="closeApp()">‹ 返回</button>
<h2 id="appTitle"></h2>
</div>
<div id="appbody"></div>
</section>

<section class="editor" id="editor">
<div class="apphead">
<button onclick="closeEditor()">‹ 返回</button>
<h2>编辑手机</h2>
</div>
<p class="notice">内容保存在当前浏览器中。此版本还没有云端同步。</p>
<label>锁屏壁纸图片网址</label><input class="field" id="eWallpaper">
<label>照片面板图片网址</label><input class="field" id="eWidget">
<label>聊天记录（每行一条）</label><textarea id="eChat"></textarea>
<label>微信</label><textarea id="eWechat"></textarea>
<label>Instagram</label><textarea id="eInstagram"></textarea>
<label>X</label><textarea id="eX"></textarea>
<label>Threads</label><textarea id="eThreads"></textarea>
<label>小红书</label><textarea id="eRedbook"></textarea>
<label>豆瓣</label><textarea id="eDouban"></textarea>
<label>微博</label><textarea id="eWeibo"></textarea>
<label>备忘录</label><textarea id="eNotes"></textarea>
<label>短信</label><textarea id="eSMS"></textarea>
<label>联系人</label><textarea id="eContacts"></textarea>
<label>通话记录</label><textarea id="eCalls"></textarea>
<label>相册图片网址（每行一个）</label><textarea id="eAlbum"></textarea>
<label>音乐列表</label><textarea id="eMusic"></textarea>
<button class="primary" onclick="saveEditor()">保存发布</button>
<button class="secondary" onclick="closeEditor()">取消</button>
</section>
<div id="toast"></div>
</div>

<script>
const defaults={
wallpaper:"",widget:"",
chat:"周安信：在吗？\n朋友：在。",
wechat:"这里是微信内容。",
instagram:"这里是 Instagram 动态。",
x:"这里是 X 的帖子。",
threads:"这里是 Threads 动态。",
redbook:"这里是小红书笔记。",
douban:"这里是豆瓣动态。",
weibo:"这里是微博内容。",
notes:"备忘录内容",
sms:"暂无短信",
contacts:"暂无联系人",
calls:"暂无通话记录",
album:"",
music:"暂无歌曲"
};

let data;
try{
data={...defaults,...JSON.parse(localStorage.getItem("vitroData")||"{}")};
}catch(e){
data={...defaults};
}

let pin="",mode="guest",page=0,startX=0;

const apps=[
["Safari","safari","◉"],
["备忘录","notes","▤"],
["日历","calendar","31"],
["设置","settings","⚙"],
["微信","wechat","微"],
["Instagram","instagram","◎"],
["X","x","X"],
["YouTube","youtube","▶"],
["Threads","threads","@"],
["小红书","redbook","书"],
["豆瓣","douban","豆"],
["微博","weibo","微"],
["QQ","qq","Q"],
["KakaoTalk","kakao","K"],
["音乐","music","♫"],
["聊天","chat","▰"]
];

const dockApps=[
["电话","phone","☎"],
["短信","sms","▰"],
["照片","photos","✿"],
["相机","camera","◉"]
];

function iconHTML(a){
return `<button class="appicon" onclick="openApp('${a[1]}')"><div class="icon">${a[2]}</div><span>${a[0]}</span></button>`;
}

function renderGrid(){
document.getElementById("grid").innerHTML=
apps.slice(page*8,page*8+8).map(iconHTML).join("");
document.getElementById("dots").textContent=page===0?"● ○":"○ ●";
document.getElementById("dock").innerHTML=dockApps.map(iconHTML).join("");
}

function tick(){
const d=new Date();
const t=d.toLocaleTimeString("zh-CN",{
hour:"2-digit",minute:"2-digit",hour12:false
});
const date=d.toLocaleDateString("zh-CN",{
month:"long",day:"numeric",weekday:"long"
});
["statusTime","lockTime","homeTime"].forEach(id=>{
document.getElementById(id).textContent=t;
});
["lockDate","homeDate"].forEach(id=>{
document.getElementById(id).textContent=date;
});
}

function applyImages(){
document.getElementById("wallpaper").style.backgroundImage=
data.wallpaper?`url("${data.wallpaper}")`:
"linear-gradient(145deg,#d8d2ed,#799ab8 50%,#26364c)";
const photo=data.widget?`url("${data.widget}")`:
"linear-gradient(135deg,#d6d1ed,#89a6bf,#344761)";
document.getElementById("lockPhoto").style.backgroundImage=photo;
document.getElementById("widget").style.backgroundImage=photo;
}

function toast(s){
const t=document.getElementById("toast");
t.textContent=s;
t.style.display="block";
setTimeout(()=>t.style.display="none",1800);
}

function showPin(){
document.getElementById("lock").style.display="none";
document.getElementById("passcode").style.display="block";
pin="";
updatePin();
}

function updatePin(){
document.getElementById("pinDots").textContent=
Array.from({length:4},(_,i)=>i<pin.length?"●":"○").join(" ");
}

function key(k){
if(k==="cancel"){
document.getElementById("passcode").style.display="none";
document.getElementById("lock").style.display="block";
pin="";
updatePin();
return;
}

if(k==="clear"){
pin=pin.slice(0,-1);
updatePin();
return;
}

if(!/^\d$/.test(k)||pin.length>=4)return;

pin+=k;
updatePin();

if(pin.length===4){
if(pin==="1225"){
mode="owner";
enterHome();
}else if(pin==="0000"){
mode="guest";
enterHome();
}else{
toast("密码错误，请重试");
setTimeout(()=>{
pin="";
updatePin();
},500);
}
}
}

/* 密码键盘统一监听，避免每个按钮重复绑定事件 */
document.getElementById("keypad").addEventListener("click",function(event){
const button=event.target.closest("button[data-key]");
if(!button)return;
key(button.dataset.key);
});

function enterHome(){
document.getElementById("passcode").style.display="none";
document.getElementById("lock").style.display="none";
document.getElementById("home").style.display="block";
document.getElementById("ownerbar").style.display=
mode==="owner"?"block":"none";
renderGrid();
}

function escapeHTML(s){
return String(s||"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function entries(s){
const a=String(s||"").split("\n").filter(x=>x.trim());
return a.length
?a.map(x=>`<div class="entry">${escapeHTML(x)}</div>`).join("")
:'<div class="entry">暂无内容</div>';
}

function openApp(id){
document.getElementById("home").style.display="none";
document.getElementById("appscreen").style.display="block";

const a=[...apps,...dockApps].find(x=>x[1]===id);
document.getElementById("appTitle").textContent=a?a[0]:id;
const body=document.getElementById("appbody");

const fields={
chat:"chat",wechat:"wechat",instagram:"instagram",x:"x",
threads:"threads",redbook:"redbook",douban:"douban",
weibo:"weibo",notes:"notes",sms:"sms",contacts:"contacts",
music:"music",calls:"calls"
};

if(fields[id]){
body.innerHTML=entries(data[fields[id]]);
if(id==="notes"&&mode==="owner"){
body.innerHTML+=`<textarea id="quickNote">${escapeHTML(data.notes)}</textarea>
<button class="primary" onclick="saveNote()">保存备忘录</button>`;
}
return;
}

if(id==="photos"){
const imgs=data.album.split("\n").filter(x=>x.trim());
body.innerHTML=imgs.length
?`<div class="albumgrid">${imgs.map(u=>`<img src="${escapeHTML(u)}">`).join("")}</div>`
:'<div class="entry">相册暂无照片。主人可以在编辑手机里添加图片网址。</div>';
return;
}

if(id==="phone"){
body.innerHTML="<h3>联系人</h3>"+entries(data.contacts)+
"<h3>最近通话</h3>"+entries(data.calls);
return;
}

if(id==="camera"){
body.innerHTML='<div class="entry"><h3>相机</h3><p>模拟相机</p><button class="primary" onclick="toast(\'拍照完成（模拟）\')">拍照</button></div>';
return;
}

if(id==="calendar"){
body.innerHTML=`<div class="entry"><h3>${new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long"})}</h3>${new Date().toLocaleDateString("zh-CN",{weekday:"long",month:"long",day:"numeric"})}</div>`;
return;
}

if(id==="settings"){
body.innerHTML=`<div class="entry">当前模式：${mode==="owner"?"主人编辑模式":"访客浏览模式"}</div>
<button class="secondary" onclick="switchUser()">切换用户</button>
${mode==="owner"?'<button class="primary" onclick="closeApp();openEditor()">编辑手机</button>':""}`;
return;
}

if(id==="safari"){
body.innerHTML='<div class="entry"><input class="field" id="weburl" placeholder="输入网址"><button class="primary" onclick="goWeb()">打开网页</button></div>';
return;
}

if(id==="youtube"){
body.innerHTML='<div class="entry"><button class="primary" onclick="window.open(\'https://www.youtube.com\',\'_blank\')">打开 YouTube</button></div>';
return;
}

if(id==="qq"||id==="kakao"){
body.innerHTML=entries(data.chat);
return;
}

body.innerHTML='<div class="entry">应用模拟页面</div>';
}

function closeApp(){
document.getElementById("appscreen").style.display="none";
document.getElementById("home").style.display="block";
}

function switchUser(){
closeApp();
document.getElementById("home").style.display="none";
document.getElementById("ownerbar").style.display="none";
showPin();
}

function goWeb(){
let u=document.getElementById("weburl").value.trim();
if(!u)return;
if(!/^https?:\/\//i.test(u))u="https://"+u;
window.open(u,"_blank");
}

function saveNote(){
data.notes=document.getElementById("quickNote").value;
localStorage.setItem("vitroData",JSON.stringify(data));
toast("已保存");
}

function openEditor(){
if(mode!=="owner"){
toast("访客模式不能编辑");
return;
}
document.getElementById("home").style.display="none";
document.getElementById("appscreen").style.display="none";
document.getElementById("editor").style.display="block";

const map={
Wallpaper:"wallpaper",Widget:"widget",Chat:"chat",Wechat:"wechat",
Instagram:"instagram",X:"x",Threads:"threads",Redbook:"redbook",
Douban:"douban",Weibo:"weibo",Notes:"notes",SMS:"sms",
Contacts:"contacts",Calls:"calls",Album:"album",Music:"music"
};

for(const [s,k] of Object.entries(map)){
const el=document.getElementById("e"+s);
if(el)el.value=data[k]||"";
}
}

function closeEditor(){
document.getElementById("editor").style.display="none";
document.getElementById("home").style.display="block";
}

function saveEditor(){
const map={
Wallpaper:"wallpaper",Widget:"widget",Chat:"chat",Wechat:"wechat",
Instagram:"instagram",X:"x",Threads:"threads",Redbook:"redbook",
Douban:"douban",Weibo:"weibo",Notes:"notes",SMS:"sms",
Contacts:"contacts",Calls:"calls",Album:"album",Music:"music"
};

for(const [s,k] of Object.entries(map)){
const el=document.getElementById("e"+s);
if(el)data[k]=el.value.trim();
}

try{
localStorage.setItem("vitroData",JSON.stringify(data));
}catch(e){
toast("保存失败，图片网址或内容可能过多");
return;
}

applyImages();
document.getElementById("editor").style.display="none";
document.getElementById("home").style.display="block";
toast("保存成功");
}

document.getElementById("phone").addEventListener("touchstart",e=>{
startX=e.touches[0].clientX;
},{passive:true});

document.getElementById("phone").addEventListener("touchend",e=>{
const dx=e.changedTouches[0].clientX-startX;
if(document.getElementById("home").style.display==="block"&&Math.abs(dx)>70){
page=dx<0?1:0;
renderGrid();
}
},{passive:true});

applyImages();
renderGrid();
tick();
setInterval(tick,1000);
</script>
  
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import {
    getFirestore,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD17inqy6azg4DkP5mfdsAFmjfeeUesb6I",
    authDomain: "virtual-iphone-25576.firebaseapp.com",
    projectId: "virtual-iphone-25576",
    storageBucket: "virtual-iphone-25576.firebasestorage.app",
    messagingSenderId: "146548605700",
    appId: "1:146548605700:web:6663c6d750eef155b00651"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadChapter() {
    try {
      const chapterRef = doc(db, "gamecontent", "chapter1");
      const chapterSnap = await getDoc(chapterRef);

      if (chapterSnap.exists()) {
        const data = chapterSnap.data();
        console.log("第一章标题：", data.title);
        console.log("第一章剧情：", data.content);
      } else {
        console.log("没有找到第一章文档");
      }
    } catch (error) {
      console.error("读取剧情失败：", error);
    }
  }

  loadChapter();
</script>

</body>
</html>
