
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Virtual iPhone</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;color:white}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#111}
button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
#phone{position:relative;width:100%;max-width:430px;height:100dvh;min-height:560px;margin:auto;overflow:hidden;background:#25334a;isolation:isolate}
.screen{position:absolute;inset:0;display:none;overflow:hidden;background-size:cover;background-position:center}
.screen.active{display:block}
.screen:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0002,transparent 35%,#0001)}
#lock,#passcode{background-image:linear-gradient(160deg,#91a9bd,#64748d 48%,#28374b)}
#lock{text-align:center;touch-action:pan-y}
#lockDate{position:absolute;top:19%;left:0;right:0;font-size:20px;text-shadow:0 2px 12px #0005}
#lockTime{position:absolute;top:22%;left:0;right:0;font-size:clamp(86px,24vw,108px);line-height:1.05;font-weight:300;letter-spacing:-5px;font-variant-numeric:tabular-nums;text-shadow:0 2px 15px #0003}
#lockHint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;font-size:13px;text-shadow:0 1px 8px #0007}
#swipeBar{width:135px;height:5px;border-radius:5px;background:#fff;margin:0 auto 10px}
#status{position:absolute;z-index:2;top:calc(10px + env(safe-area-inset-top));left:27px;right:27px;display:flex;justify-content:space-between;font-size:12px;text-shadow:0 1px 4px #0005}
#passcode{text-align:center;padding-top:calc(90px + env(safe-area-inset-top))}
#passTitle{font-size:20px;font-weight:500}
#passDots{display:flex;justify-content:center;gap:17px;margin:31px auto 36px}
.passDot{width:11px;height:11px;border:1px solid white;border-radius:50%}
.passDot.filled{background:white}
#keypad{display:grid;grid-template-columns:repeat(3,74px);justify-content:center;gap:13px 20px}
.numKey{height:74px;width:74px;border-radius:50%;border:1px solid #ffffff40;background:#ffffff1c;color:white;font-size:31px;font-weight:300;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.numKey:active{background:#ffffff55}
#passMsg{height:20px;margin-top:17px;font-size:13px}
#cancelPass{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));left:0;right:0;border:0;background:none;color:white;font-size:15px}
#home{padding:calc(54px + env(safe-area-inset-top)) 20px calc(116px + env(safe-area-inset-bottom));touch-action:pan-y}
#photoWidget{height:165px;border-radius:23px;background:#ffffff20;background-size:cover;background-position:center;position:relative;overflow:hidden;margin:12px 0 27px}
#photoWidget:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#0005)}
#widgetClock{position:absolute;z-index:1;bottom:12px;left:16px;font-size:36px;font-weight:300;text-shadow:0 2px 8px #0006}
#appGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:23px 8px}
.appIcon{min-width:0;padding:0;border:0;background:none;color:white;text-align:center;text-shadow:0 1px 4px #0005}
.iconImage{display:flex;width:59px;height:59px;margin:0 auto 5px;align-items:center;justify-content:center;border-radius:14px;background:linear-gradient(145deg,#f5f5f7,#d5d5dc);color:#555;font-size:23px;overflow:hidden}
.iconImage img{width:100%;height:100%;object-fit:cover}
.appLabel{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pageDots{position:absolute;bottom:calc(99px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:8px}
.pageDot{width:6px;height:6px;border-radius:50%;background:#ffffff66}
.pageDot.on{background:white}
#dock{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:14px;right:14px;height:76px;border-radius:25px;background:#ffffff35;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
#dock .iconImage{width:49px;height:49px;margin-bottom:0}
#dock .appLabel{display:none}
#app{background:#f2f2f7;color:#111;overflow-y:auto;padding:calc(58px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
#app:before{display:none}
#appNav{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
#appNav button{border:0;background:none;color:#087fff;font-size:16px;padding:8px 0}
#appTitle{font-size:28px;font-weight:700;margin:0}
.appCard{padding:16px;background:white;border-radius:15px;margin:12px 0;overflow-wrap:anywhere}
.appCard textarea,.appCard input{width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;color:#222;background:#fff;margin:8px 0}
.appCard textarea{min-height:125px;resize:vertical}
.primary{background:#087fff;color:white;border:0;border-radius:12px;padding:11px 16px}
.secondary{background:#e8e8ed;color:#222;border:0;border-radius:12px;padding:11px 16px}
.muted{font-size:13px;color:#777;line-height:1.5}
#editor{background:#f2f2f7;color:#111;overflow-y:auto;padding:calc(25px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
#editor h1{font-size:30px}
#editor label{display:block;font-size:14px;margin-top:14px}
#editor input:not([type=file]),#editor textarea{width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;background:white;color:#222;margin-top:7px}
#editor textarea{min-height:75px}
#editor button{margin:8px 5px 0 0}
#toast{position:absolute;z-index:10;top:calc(50px + env(safe-area-inset-top));left:20px;right:20px;text-align:center;pointer-events:none;font-size:13px}
@media(max-height:700px){#lockDate{top:14%}#lockTime{top:17%}#passcode{padding-top:calc(65px + env(safe-area-inset-top))}#passDots{margin:22px auto 25px}.numKey{width:62px;height:62px}#keypad{grid-template-columns:repeat(3,62px);gap:10px 18px}}
</style>
</head>
<body>
<div id="phone">
  <section id="lock" class="screen active">
    <div id="lockDate"></div>
    <div id="lockTime">9:41</div>
    <div id="lockHint"><div id="swipeBar"></div>向上轻扫以解锁</div>
  </section>

  <section id="passcode" class="screen">
    <div id="status"><span id="statusTime">9:41</span><span>●●●　Wi-Fi　▰</span></div>
    <div id="passTitle">输入密码</div>
    <div id="passDots"></div>
    <div id="keypad"></div>
    <div id="passMsg"></div>
    <button id="cancelPass" onclick="showScreen('lock')">取消</button>
  </section>

  <section id="home" class="screen">
    <div id="status"><span id="homeStatusTime">9:41</span><span>●●●　Wi-Fi　▰</span></div>
    <div id="photoWidget"><span id="widgetClock">9:41</span></div>
    <div id="appGrid"></div>
    <div id="pageDots"><span class="pageDot on"></span><span class="pageDot"></span></div>
    <div id="dock"></div>
  </section>

  <section id="app" class="screen">
    <div id="appNav">
      <button onclick="showScreen('home')">‹ 桌面</button>
      <h1 id="appTitle">应用</h1>
      <button onclick="lockPhone()">锁定</button>
    </div>
    <div id="appBody"></div>
  </section>

  <section id="editor" class="screen">
    <button class="secondary" onclick="showScreen('home')">‹ 返回桌面</button>
    <h1>编辑与发布</h1>
    <p class="muted">编辑模式：保存到当前浏览器。此版本暂未连接 Firebase。</p>
    <label>锁屏密码（固定四位）</label>
    <input value="1225" disabled>
    <label>锁屏壁纸</label><input id="wallFile" type="file" accept="image/*">
    <label>桌面照片面板</label><input id="widgetFile" type="file" accept="image/*">
    <label>聊天记录</label><textarea id="eChat"></textarea>
    <label>Instagram 内容</label><textarea id="eInstagram"></textarea>
    <label>X 内容</label><textarea id="eX"></textarea>
    <label>Threads 内容</label><textarea id="eThreads"></textarea>
    <label>小红书内容</label><textarea id="eXhs"></textarea>
    <label>微信内容</label><textarea id="eWechat"></textarea>
    <label>备忘录</label><textarea id="eNotes"></textarea>
    <label>短信</label><textarea id="eSms"></textarea>
    <label>联系人</label><textarea id="eContacts"></textarea>
    <label>通话记录</label><textarea id="eCalls"></textarea>
    <label>添加相册照片</label><input id="albumFiles" type="file" accept="image/*" multiple>
    <div id="albumEditor"></div>
    <button class="primary" onclick="publish()">保存并发布</button>
    <button class="secondary" onclick="showScreen('home')">预览桌面</button>
    <button class="secondary" onclick="lockPhone()">锁屏</button>
  </section>
  <div id="toast"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const DOCK=["电话","信息","相册","相机"];
const PAGES=[
 ["Safari","备忘录","日历","设置","微信","Instagram","X","YouTube"],
 ["Threads","小红书","豆瓣","微博","QQ","KakaoTalk","音乐","聊天"]
];
const GLYPHS={
 "Safari":"◉","备忘录":"▤","日历":"23","设置":"⚙","微信":"●","Instagram":"◎","X":"X","YouTube":"▶",
 "Threads":"＠","小红书":"书","豆瓣":"豆","微博":"眼","QQ":"Q","KakaoTalk":"●","音乐":"♫","聊天":"•••",
 "电话":"☎","信息":"●","相册":"▧","相机":"◉"
};
const DEFAULT={
 wall:"",widget:"",
 chat:"好友：在吗？\n我：在。",instagram:"还没有发布内容。",
 xpost:"还没有发布内容。",threads:"还没有发布内容。",
 xhs:"还没有发布内容。",wechat:"还没有发布内容。",
 notes:"",sms:"暂无短信。",contacts:"暂无联系人。",calls:"暂无通话记录。",album:[]
};
let data={...DEFAULT};
try{data={...data,...JSON.parse(localStorage.getItem("virtual-iphone-v2")||"{}")}}catch(e){}
data.album=Array.isArray(data.album)?data.album:[];
let mode="guest",page=0,pin="",startY=0,startX=0;

function saveData(){
 try{localStorage.setItem("virtual-iphone-v2",JSON.stringify(data))}
 catch(e){alert("本机存储空间不足，请减少相册照片后再保存。")}
}
function showScreen(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 $(id).classList.add("active");
}
function toast(message){
 $("toast").textContent=message;
 setTimeout(()=>$("toast").textContent="",1800);
}
function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function tick(){
 const d=new Date();
 const time=d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false});
 $("lockTime").textContent=time;
 $("widgetClock").textContent=time;
 $("statusTime").textContent=time;
 $("homeStatusTime").textContent=time;
 $("lockDate").textContent=d.toLocaleDateString("zh-CN",{weekday:"long",month:"long",day:"numeric"});
}
tick();setInterval(tick,15000);

function openPasscode(){
 pin="";renderPassDots();$("passMsg").textContent="";
 showScreen("passcode");
}
$("lock").addEventListener("click",openPasscode);
$("lock").addEventListener("touchstart",e=>{startY=e.touches[0].clientY},{passive:true});
$("lock").addEventListener("touchend",e=>{
 if(startY-e.changedTouches[0].clientY>20)openPasscode();
},{passive:true});

$("keypad").innerHTML=[1,2,3,4,5,6,7,8,9,"delete",0,"enter"].map(n=>{
 let label=n==="delete"?"⌫":n==="enter"?"✓":n;
 let accessible=n==="delete"?"删除":n==="enter"?"确认":n;
 return `<button class="numKey" aria-label="${accessible}" onclick="pressKey('${n}')">${label}</button>`;
}).join("");

function renderPassDots(){
 $("passDots").innerHTML=Array.from({length:4},(_,i)=>
 `<span class="passDot ${i<pin.length?"filled":""}"></span>`).join("");
}
function pressKey(n){
 if(n==="delete"){pin=pin.slice(0,-1);renderPassDots();$("passMsg").textContent="";return}
 if(n==="enter"){verifyPin();return}
 if(pin.length>=4)return;
 pin+=n;renderPassDots();
 if(pin.length===4)verifyPin();
}
function verifyPin(){
 if(pin==="1225"){
  mode="editor";loadEditor();renderHome();showScreen("home");toast("编辑模式");
 }else if(pin==="0000"){
  mode="guest";renderHome();showScreen("home");toast("访客模式");
 }else{
  $("passMsg").textContent="密码不正确";
  setTimeout(()=>{pin="";renderPassDots();$("passMsg").textContent=""},700);
 }
}
function lockPhone(){pin="";showScreen("lock")}

function iconButton(name){
 return `<button class="appIcon" onclick="openApp('${safe(name)}')">
 <span class="iconImage">${GLYPHS[name]||"●"}</span><span class="appLabel">${safe(name)}</span></button>`;
}
function renderHome(){
 $("appGrid").innerHTML=PAGES[page].map(iconButton).join("");
 $("pageDots").innerHTML=PAGES.map((_,i)=>`<span class="pageDot ${i===page?"on":""}"></span>`).join("");
 $("dock").innerHTML=DOCK.map(iconButton).join("");
 ["lock","passcode","home","app"].forEach(id=>{
  $(id).style.backgroundImage=data.wall?`url("${data.wall}")`:"";
 });
 $("photoWidget").style.backgroundImage=data.widget?`url("${data.widget}")`:"";
}
$("home").addEventListener("touchstart",e=>{startX=e.touches[0].clientX},{passive:true});
$("home").addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].clientX-startX;
 if(Math.abs(dx)>55){page=dx<0?1:0;renderHome()}
},{passive:true});

function openApp(name){
 $("appTitle").textContent=name;
 let html="";
 const keys={
  "微信":"wechat","聊天":"chat","Instagram":"instagram","X":"xpost",
  "Threads":"threads","小红书":"xhs","备忘录":"notes","信息":"sms",
  "电话":"calls","联系人":"contacts"
 };
 if(name==="相册"){
  html=data.album.map((src,i)=>`<div class="appCard"><img src="${src}" alt="相册照片${i+1}" style="width:100%;border-radius:12px"></div>`).join("")||'<div class="appCard">相册里还没有照片。</div>';
  if(mode==="editor")html+=`<div class="appCard"><input type="file" id="addAlbum" accept="image/*" multiple><button class="primary" onclick="addPhotos('addAlbum')">添加照片</button></div>`;
 }else if(name==="设置"){
  html=`<div class="appCard"><h3>设置</h3><p>当前模式：${mode==="editor"?"编辑者":"访客"}</p><button class="primary" onclick="openEditor()">壁纸与内容设置</button></div>`;
 }else if(name==="日历"){
  html=`<div class="appCard"><h2>${new Date().toLocaleDateString("zh-CN",{month:"long",day:"numeric"})}</h2>${new Date().toLocaleDateString("zh-CN",{weekday:"long",year:"numeric"})}</div>`;
 }else if(name==="相机"){
  html='<div class="appCard">这是相机模拟页面。此版本尚未启用设备摄像头。</div>';
 }else if(name==="音乐"){
  html='<div class="appCard"><h3>正在播放</h3><p>暂无歌曲</p></div>';
 }else if(keys[name]){
  const k=keys[name];
  html=`<div class="appCard"><h3>${safe(name)}</h3><textarea id="appText" ${mode==="guest"?"readonly":""}>${safe(data[k])}</textarea>${mode==="editor"?`<button class="primary" onclick="saveAppText('${k}')">保存内容</button>`:'<p class="muted">访客模式：只读。</p>'}</div>`;
 }else{
  html=`<div class="appCard"><h3>${safe(name)}</h3><p>这是 ${safe(name)} 的模拟应用页面。</p><p class="muted">图标与完整应用内容可在后续版本继续完善。</p></div>`;
 }
 $("appBody").innerHTML=html;showScreen("app");
}
function saveAppText(key){data[key]=$("appText").value;saveData();toast("已保存到本机")}
function openEditor(){
 if(mode!=="editor"){toast("只有编辑模式可以修改");return}
 loadEditor();showScreen("editor");
}
function loadEditor(){
 $("eChat").value=data.chat;$("eInstagram").value=data.instagram;
 $("eX").value=data.xpost;$("eThreads").value=data.threads;
 $("eXhs").value=data.xhs;$("eWechat").value=data.wechat;
 $("eNotes").value=data.notes;$("eSms").value=data.sms;
 $("eContacts").value=data.contacts;$("eCalls").value=data.calls;
 renderAlbumEditor();
}
function readImage(file,callback){
 const reader=new FileReader();
 reader.onload=()=>callback(reader.result);
 reader.readAsDataURL(file);
}
$("wallFile").addEventListener("change",e=>{
 if(e.target.files[0])readImage(e.target.files[0],src=>{data.wall=src;toast("壁纸已选取")});
});
$("widgetFile").addEventListener("change",e=>{
 if(e.target.files[0])readImage(e.target.files[0],src=>{data.widget=src;toast("照片面板已选取")});
});
$("albumFiles").addEventListener("change",e=>{
 Array.from(e.target.files||[]).forEach(file=>readImage(file,src=>{
  data.album.push(src);renderAlbumEditor();
 }));
 e.target.value="";
});
function addPhotos(id){
 Array.from($(id).files||[]).forEach(file=>readImage(file,src=>{
  data.album.push(src);saveData();openApp("相册");
 }));
}
function renderAlbumEditor(){
 $("albumEditor").innerHTML=data.album.map((_,i)=>
 `<div class="appCard">相册照片 ${i+1} <button class="secondary" onclick="removePhoto(${i})">删除</button></div>`).join("");
}
function removePhoto(i){data.album.splice(i,1);renderAlbumEditor()}
function publish(){
 data.chat=$("eChat").value;data.instagram=$("eInstagram").value;
 data.xpost=$("eX").value;data.threads=$("eThreads").value;
 data.xhs=$("eXhs").value;data.wechat=$("eWechat").value;
 data.notes=$("eNotes").value;data.sms=$("eSms").value;
 data.contacts=$("eContacts").value;data.calls=$("eCalls").value;
 saveData();renderHome();toast("已保存到本机");
}
renderHome();
</script>
</body>
</html>
